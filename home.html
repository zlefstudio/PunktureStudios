<!doctype html>
<html lang="en" data-home-intro="pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="PUNKTURE STUDIOS — Professional piercing studio & pop-up events. Live queue, appointments, aftercare, and pop-up schedule." />
    <meta name="theme-color" content="#0d0b14" />
    <title>PUNKTURE STUDIOS — Home</title>
    <!-- Critical first-paint curtain: runs before the app bundle or fonts arrive. -->
    <style>
      html[data-home-intro] { background: #000; scrollbar-gutter: stable; }
      #pk-boot { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
      #pk-boot[hidden] { display: none; }
      .pk-boot-curtain { position: absolute; inset: 0; background: #000; }
      .pk-boot-mark { position: absolute; top: 50%; left: 50%; width: 96px; height: 96px; transform: translate(-50%,-50%); }
      .pk-boot-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .pk-boot-halo { position: absolute; inset: -12px; border: 1px solid #c4b5fd; border-radius: 50%; opacity: .7; }
      @media (prefers-reduced-motion: no-preference) {
        html[data-home-intro="pending"], html[data-home-intro="revealing"] { overflow: hidden; }
        html[data-home-intro="pending"] :is(.pk-orbit-card,.pk-ring-brand,.pk-orbit-guide,.pk-hero-top,.pk-hero-heading,.pk-hero-bottom,.pk-grain,.public-shell > .sticky) { opacity: 0; }
        html[data-home-intro="pending"] .pk-home > :not(.pk-hero):not(.pk-grain),
        html[data-home-intro="revealing"] .pk-home > :not(.pk-hero):not(.pk-grain),
        html[data-home-intro="pending"] .public-content > footer,
        html[data-home-intro="revealing"] .public-content > footer { visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) { #pk-boot { display: none; } }
    </style>
    <script>
      (() => {
        const html = document.documentElement;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          html.dataset.homeIntro = 'ready';
          return;
        }
        html.dataset.homeScrollRestoration = history.scrollRestoration;
        history.scrollRestoration = 'manual';
        // Fail open even if the main module arrives late or does not run.
        setTimeout(() => {
          if (html.dataset.homeIntro === 'ready') return;
          window.dispatchEvent(new Event('pk:intro-skip'));
          html.dataset.homeIntro = 'ready';
          const boot = document.getElementById('pk-boot');
          if (boot) boot.hidden = true;
          if (html.dataset.homeScrollRestoration) {
            history.scrollRestoration = html.dataset.homeScrollRestoration;
            delete html.dataset.homeScrollRestoration;
          }
        }, 6000);
      })();
    </script>
    <!-- Inter + JetBrains Mono from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
  </head>
  <body>
    <div id="pk-boot" aria-hidden="true">
      <div class="pk-boot-curtain"></div>
      <div class="pk-boot-mark"><span class="pk-boot-halo"></span><img src="/logo.png" width="96" height="96" alt="" fetchpriority="high" /></div>
    </div>
    <noscript><style>#pk-boot { display: none; }</style>This experience requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/home.tsx"></script>
  </body>
</html>
